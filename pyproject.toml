[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "superwand"
dynamic = ["version"]
description = "Retheme images, SVG and CSS with color palettes and gradients."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julian Henry" }]
keywords = [
    "color",
    "palette",
    "theme",
    "retheme",
    "recolor",
    "gradient",
    "image",
    "svg",
    "css",
    "oklab",
    "kmeans",
    "pixel-art",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=11.3",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
studio = ["flask>=3.0"]

[project.urls]
Homepage = "https://github.com/juleshenry/superwand"
Source = "https://github.com/juleshenry/superwand"
Issues = "https://github.com/juleshenry/superwand/issues"
Changelog = "https://github.com/juleshenry/superwand/blob/main/CHANGELOG.md"

[project.scripts]
superwand = "superwand.cli:main"
gradient-enforce = "superwand.cli:gradient_main"
css-retheme = "superwand.cli:css_main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "flask>=3.0",
]

# --- Build ------------------------------------------------------------------

[tool.hatch.version]
source = "vcs"
# Used when building outside a git checkout with tags (e.g. a shallow clone)
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/superwand"]

[tool.hatch.build.targets.sdist]
# Only ship what's needed to build and test; examples/ is hundreds of MB
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

# --- Lint / format -------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY"]
ignore = [
    "E501",    # line length is the formatter's job
    "RUF001",  # ambiguous unicode in strings ("Paixão")
    "RUF002",  # ... in docstrings
    "RUF003",  # ... in comments
    "SIM108",  # ternaries aren't always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017", "SIM117"]
"scripts/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["superwand"]

# --- Type checking ---------------------------------------------------------

[tool.mypy]
python_version = "3.10"
files = ["src/superwand"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "flask.*", "tomli"]
ignore_missing_imports = true

# --- Tests -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["superwand"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
